<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polling Is a Backstop, Not a Clock</title>
<style>
:root {
	--paper: #f8f9fe;
	--ink: #0f172a;
	--ink-soft: #334155;
	--muted: #64748b;
	--faint: #94a3b8;
	--rule: #cbd5e1;
	--surface: #ffffff;
	--code-surface: #f1f5f9;
	--accent: #7c3aed;
	--accent-surface: #eef0fb;
	--heading-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);

	--timer: #6d28d9;
	--timer-surface: #f5f3ff;
	--timer-rule: #ddd6fe;
	--signal: #0369a1;
	--signal-surface: #f0f9ff;
	--signal-rule: #bae6fd;
	--database: #475569;
	--database-surface: #f1f5f9;
	--database-rule: #cbd5e1;
	--late: #b91c1c;
	--late-surface: #fef2f2;
	--on-time: #15803d;
	--on-time-surface: #f0fdf4;
	--on-time-rule: #bbf7d0;

	--display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
	--body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
	--mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
	height: 100%;
	margin: 0;
	overflow: hidden;
	background: var(--paper);
}

body {
	font-family: var(--body);
	color: var(--ink);
	-webkit-font-smoothing: antialiased;
}

/* A fixed 1280x720 stage. The one on screen is scaled by script to fit; the speaker view shows small ones. */
.stage {
	position: relative;
	width: 1280px;
	height: 720px;
	padding: 52px 64px 60px;
	display: flex;
	flex-direction: column;
	user-select: none;
}
#stage {
	position: absolute;
	left: 50%;
	top: 50%;
	margin: -360px 0 0 -640px;
	transform-origin: center;
}

h1, h2 { margin: 0; font-family: var(--display); }

h1 {
	font-size: 66px;
	font-weight: 800;
	line-height: 1.08;
	letter-spacing: -0.03em;
	text-wrap: balance;
	background: var(--heading-gradient);
	-webkit-background-clip: text;
	background-clip: text;
	-webkit-text-fill-color: transparent;
}

h2 {
	margin-bottom: 30px;
	font-size: 38px;
	font-weight: 700;
	line-height: 1.15;
	letter-spacing: -0.02em;
}

.is-hidden { visibility: hidden; }

/* Title and closing slides */
.title-slide {
	flex: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	text-align: center;
}
.title-slide h1 { max-width: 980px; }
.subtitle {
	margin-top: 26px;
	font-size: 30px;
	font-weight: 600;
	color: var(--accent);
}
.speaker {
	margin-top: 64px;
	font-size: 24px;
	font-weight: 500;
	color: var(--ink-soft);
}
.link {
	margin-top: 8px;
	font-size: 22px;
	color: var(--muted);
}
.link a, .address a {
	color: inherit;
	text-decoration-color: var(--faint);
	text-decoration-thickness: 2px;
	text-underline-offset: 0.2em;
}

.close-slide {
	flex: 1;
	display: grid;
	grid-template-columns: 340px 1fr;
	column-gap: 72px;
	align-items: center;
}
.close-slide .qr {
	padding: 10px;
	border: 2px solid var(--rule);
	border-radius: 16px;
	background: var(--surface);
}
.qr svg { display: block; width: 100%; height: auto; }
.close-slide h1 { font-size: 54px; }
.close-slide .address {
	margin-top: 30px;
	font: 500 44px/1 var(--mono);
	color: var(--ink);
}
.close-slide .speaker { margin-top: 44px; }
.link-icon {
	width: 19px;
	height: 19px;
	margin-right: 10px;
	vertical-align: -2px;
	fill: var(--ink-soft);
}

/* Plain text slides */
.lines p {
	max-width: 1000px;
	margin: 0 0 24px;
	font-size: 28px;
	line-height: 1.38;
	color: var(--ink-soft);
}

.bio {
	display: grid;
	grid-template-columns: 220px 1fr;
	column-gap: 48px;
	align-items: start;
}
.bio img {
	width: 220px;
	height: 220px;
	border: 3px solid var(--rule);
	border-radius: 50%;
	object-fit: cover;
}

.statement {
	flex: 1;
	display: flex;
	flex-direction: column;
	justify-content: center;
}
.statement-text {
	max-width: 1040px;
	font: 700 58px/1.12 var(--display);
	letter-spacing: -0.025em;
	text-wrap: balance;
}
.statement-detail {
	max-width: 900px;
	margin-top: 30px;
	font-size: 28px;
	line-height: 1.38;
	color: var(--ink-soft);
}

/* An outcome is the one line a slide lands on: what went wrong, what the fix buys, or the point. */
.outcome {
	margin-top: 24px;
	padding: 16px 22px;
	border-left: 5px solid;
	border-radius: 10px;
	font-size: 24px;
	font-weight: 600;
	line-height: 1.3;
}
.outcome-late { color: var(--late); background: var(--late-surface); border-color: var(--late); }
.outcome-on-time { color: var(--on-time); background: var(--on-time-surface); border-color: var(--on-time); }
.outcome-plain { color: var(--ink); background: var(--accent-surface); border-color: var(--accent); }

/* Timers written large, in the same shape as the entries of a store. */
.big-entries {
	display: flex;
	flex-direction: column;
	gap: 18px;
}
.big-entry {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	padding: 24px 28px;
	border: 2px solid var(--timer-rule);
	border-radius: 14px;
	background: var(--timer-surface);
	font-size: 30px;
}
.big-entry .value {
	font: 500 30px/1 var(--mono);
	color: var(--timer);
}

/* Code */
pre {
	margin: 0;
	padding: 22px 28px;
	border: 2px solid var(--rule);
	border-radius: 12px;
	background: var(--code-surface);
	font: 400 22px/1.55 var(--mono);
	color: var(--ink-soft);
}
.tok-keyword { color: var(--accent); }
.tok-string { color: var(--on-time); }
.tok-number { color: #b45309; }
.tok-comment { color: var(--faint); }

/* Timelines drawn on one axis: polls, scans, due times and wake-ups. */
.timeline { margin-top: 22px; }
.timeline text { font-family: var(--body); font-size: 20px; }
.timeline .axis { stroke: var(--rule); stroke-width: 2; }
.timeline .mark { stroke: var(--muted); stroke-width: 2; }
.timeline .mark.is-chance { stroke: var(--accent); stroke-width: 5; }
.timeline .mark-label { fill: var(--muted); text-anchor: middle; }
.timeline .mark-label.is-chance { fill: var(--accent); font-weight: 600; }
.timeline .late-span { stroke: var(--late); stroke-width: 6; stroke-linecap: round; }
.timeline .late-label { fill: var(--late); font-weight: 600; text-anchor: middle; }
.timeline .due { fill: var(--timer); }
.timeline .due-label { fill: var(--timer); font-weight: 600; }
.timeline .window { fill: var(--timer-surface); stroke: var(--timer-rule); stroke-width: 2; }
.timeline .window-label { fill: var(--timer); font-weight: 600; text-anchor: middle; }
.timeline .window.is-miss { fill: var(--database-surface); stroke: var(--database-rule); }
.timeline .window-label.is-miss { fill: var(--muted); }
.timeline .wake { stroke-width: 4; stroke-linecap: round; }
.timeline .wake-each { stroke: var(--late); }
.timeline .wake-each-label { fill: var(--late); font-weight: 600; text-anchor: middle; }
.timeline .wake-once { stroke: var(--on-time); stroke-width: 6; }
.timeline .wake-once-label { fill: var(--on-time); font-weight: 600; text-anchor: end; }
.timeline .overshoot { fill: var(--on-time-surface); stroke: var(--on-time-rule); stroke-width: 2; }

.timeline .bar { fill: var(--accent); }
.timeline .grid { stroke: var(--rule); stroke-width: 1; }
.timeline .dot { fill: var(--accent); fill-opacity: 0.5; }
.timeline .wipe-mark { stroke: var(--ink-soft); stroke-width: 2; stroke-dasharray: 7 6; }
.timeline .scan-mark { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 2 6; }
.timeline .chart-label { fill: var(--ink); font-weight: 600; }
.timeline .chart-note { fill: var(--muted); font-size: 18px; }
.timeline.chart { margin-top: 0; }

.histogram + .histogram { margin-top: 22px; }
.histogram .timeline { margin-top: 12px; }
.histogram-name { font: 600 23px/1.2 var(--display); }
.histogram-name span {
	margin-left: 14px;
	font: 400 20px/1.2 var(--body);
	color: var(--muted);
}

/* Tables */
table {
	width: 100%;
	border-collapse: collapse;
	font-size: 25px;
	line-height: 1.3;
}
th {
	padding: 0 24px 14px 0;
	border-bottom: 2px solid var(--rule);
	font: 600 20px/1.2 var(--display);
	text-align: left;
	color: var(--muted);
}
td {
	padding: 20px 24px 20px 0;
	border-bottom: 1px solid var(--rule);
	vertical-align: top;
	color: var(--ink-soft);
}
td:first-child {
	font-weight: 600;
	color: var(--ink);
	white-space: nowrap;
}
td.is-path { font: 400 19px/1.5 var(--mono); }
td.is-path a {
	color: inherit;
	text-decoration-color: var(--faint);
	text-underline-offset: 5px;
}
table.is-dense { font-size: 22px; }
table.is-dense td { padding: 13px 24px 13px 0; }
.table-note {
	margin-top: 20px;
	font-size: 20px;
	color: var(--muted);
}

/* Two things side by side */
.compare {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 36px;
}
.compare-column {
	padding: 26px 28px 20px;
	border: 2px solid var(--rule);
	border-radius: 14px;
	background: var(--surface);
}
.compare-name {
	margin-bottom: 14px;
	font: 700 26px/1.2 var(--display);
}
.compare-column p {
	margin: 0 0 10px;
	font-size: 24px;
	line-height: 1.35;
	color: var(--ink-soft);
}

/* Stores: what the database, the timer queue and the signal list hold right now. */
.store {
	padding: 16px 16px 18px;
	border: 2px solid;
	border-radius: 12px;
}
.store-timers { color: var(--timer); background: var(--timer-surface); border-color: var(--timer-rule); }
.store-signals { color: var(--signal); background: var(--signal-surface); border-color: var(--signal-rule); }
.store-database { color: var(--database); background: var(--database-surface); border-color: var(--database-rule); }
.store-name {
	margin-bottom: 12px;
	font: 600 19px/1 var(--display);
}
.entry {
	display: flex;
	justify-content: space-between;
	padding: 10px 12px;
	border: 1.5px solid;
	border-color: inherit;
	border-radius: 8px;
	background: var(--surface);
	font: 500 20px/1 var(--mono);
	color: var(--ink);
}
.entry + .entry { margin-top: 8px; }
.entry.is-fired { color: var(--faint); }
.store-empty {
	padding: 10px 2px;
	font-size: 19px;
	color: var(--muted);
}

.split {
	display: grid;
	grid-template-columns: 1fr 190px 1fr;
	column-gap: 24px;
	align-items: center;
}
.split .store { padding: 20px 20px 22px; }
.split .store-name { margin-bottom: 16px; font-size: 23px; }
.split .entry { padding: 14px 16px; font-size: 22px; }
.split-scan {
	font-size: 22px;
	font-weight: 600;
	text-align: center;
	color: var(--muted);
}
.split-scan svg { display: block; margin: 8px auto; }
.split-scan line { stroke: var(--muted); stroke-width: 3; }
.split-scan path { fill: var(--muted); }

/* Race slide: time runs down, one row per step, and the stores on the right show what each holds. */
.race {
	flex: 1;
	min-height: 0;
	display: grid;
	grid-template-columns: 1fr 1fr 296px;
	column-gap: 36px;
	align-content: start;
}
.lane-name {
	grid-row: 1;
	padding: 0 0 16px 36px;
	font: 600 21px/1 var(--display);
}
.rail {
	margin-left: 9px;
	border-left: 2px solid var(--rule);
}
.step {
	position: relative;
	min-height: 80px;
	padding: 0 8px 14px 36px;
	font-size: 22px;
	line-height: 1.32;
	color: var(--ink-soft);
}
.step::before {
	content: "";
	position: absolute;
	left: 3px;
	top: 7px;
	width: 14px;
	height: 14px;
	border: 2px solid var(--rule);
	border-radius: 50%;
	background: var(--paper);
}
.step.is-current { color: var(--ink); font-weight: 500; }
.step.is-current::before { border-color: var(--accent); background: var(--accent); }
.step .aside {
	display: block;
	margin-top: 4px;
	font-weight: 600;
	color: var(--late);
}
.race .outcome {
	grid-column: 1 / span 2;
	margin-top: 6px;
}
.stores {
	grid-column: 3;
	display: flex;
	flex-direction: column;
	gap: 20px;
}

/* Notes, as the speaker view and the notes list both show them. */
.note-say {
	margin: 14px 0 0;
	font-size: 26px;
	line-height: 1.4;
}
.note-more {
	margin: 14px 0 0;
	font-size: 19px;
	line-height: 1.45;
	color: var(--ink-soft);
}
.note-more span {
	display: block;
	font-size: 15px;
	font-weight: 600;
	color: var(--muted);
}

/* The notes list: every slide's notes on one page, in place of the slides. */
#notes { display: none; }
html.is-notes, html.is-notes body { height: auto; overflow: auto; }
html.is-notes #stage { display: none; }
html.is-notes #notes { display: block; }
.notes-list {
	max-width: 820px;
	margin: 0 auto;
	padding: 40px 24px 80px;
}
.notes-list h1 { font-size: 36px; }
.notes-list h2 {
	margin: 44px 0 4px;
	padding-bottom: 10px;
	border-bottom: 2px solid var(--rule);
	font-size: 16px;
	letter-spacing: 0;
	color: var(--accent);
}
.notes-list h2 span {
	margin-left: 12px;
	font-weight: 400;
	color: var(--muted);
}
.notes-list h3 {
	margin: 0;
	font: 600 20px/1.35 var(--display);
}
.notes-list h3 a { color: inherit; text-decoration: none; }
.notes-list section {
	display: grid;
	grid-template-columns: 40px 1fr;
	column-gap: 12px;
	padding: 18px 0;
	border-bottom: 1px solid var(--rule);
	break-inside: avoid;
}
.notes-list .note-say { margin-top: 8px; font-size: 20px; }
.notes-list .note-more { margin-top: 10px; font-size: 17px; }
.notes-summary {
	margin: 10px 0 0;
	font-size: 18px;
	color: var(--muted);
}
.notes-number {
	font-size: 18px;
	font-variant-numeric: tabular-nums;
	color: var(--muted);
}
.notes-reveals {
	margin-left: 10px;
	font: 400 15px/1 var(--body);
	white-space: nowrap;
	color: var(--muted);
}

/* The speaker view: a second window with the notes, what the room sees, and what the next press shows. */
html.speaker-view, html.speaker-view body { height: auto; min-height: 100%; overflow: auto; }
html.speaker-view body { padding: 20px 28px 40px; }
.speaker-bar {
	display: flex;
	align-items: baseline;
	gap: 20px;
	padding-bottom: 14px;
	border-bottom: 2px solid var(--rule);
}
.speaker-position {
	font: 600 22px/1 var(--display);
	font-variant-numeric: tabular-nums;
	color: var(--muted);
}
.speaker-title {
	flex: 1;
	font: 700 26px/1.2 var(--display);
}
.speaker-clock {
	font: 500 24px/1 var(--mono);
	font-variant-numeric: tabular-nums;
}
.speaker-clock button {
	margin-left: 12px;
	padding: 4px 10px;
	border: 1.5px solid var(--rule);
	border-radius: 6px;
	background: var(--surface);
	font: 500 14px/1 var(--body);
	color: var(--muted);
	cursor: pointer;
}
.speaker-previews {
	display: flex;
	flex-wrap: wrap;
	align-items: flex-start;
	gap: 24px;
	margin: 18px 0 6px;
}
.speaker-previews figure { margin: 0; }
.speaker-previews figcaption {
	margin-bottom: 8px;
	font-size: 16px;
	font-weight: 600;
	color: var(--muted);
}
.preview {
	overflow: hidden;
	border: 2px solid var(--rule);
	border-radius: 10px;
}
.preview .stage { transform-origin: 0 0; }
.preview-now { width: 580px; height: 328px; }
.preview-now .stage { transform: scale(0.45); }
.preview-next { width: 452px; height: 256px; }
.preview-next .stage { transform: scale(0.35); }

@media print {
	html.is-notes body { background: none; }
	.notes-list { max-width: none; padding: 0; }
}

/* Presenter aids, kept faint: how many reveals this slide has, and where we are in the deck. */
.reveals {
	position: absolute;
	left: 64px;
	bottom: 26px;
	display: flex;
	gap: 6px;
}
.reveals i {
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--rule);
}
.reveals i.is-shown { background: var(--muted); }
.page {
	position: absolute;
	right: 30px;
	bottom: 20px;
	font-size: 16px;
	font-weight: 500;
	color: var(--faint);
}

/* Motion only answers the presenter's key press: the thing just revealed, the entry just written. */
.is-entering { animation: enter 320ms ease-out; }
.entry.is-new { animation: written 1100ms ease-out; }
@keyframes enter {
	from { opacity: 0; transform: translateY(8px); }
}
@keyframes written {
	from { background: currentColor; }
}
@media (prefers-reduced-motion: reduce) {
	.is-entering, .entry.is-new { animation: none; }
}
</style>
</head>
<body>
<main id="stage" class="stage"></main>
<div id="notes" class="notes-list"></div>

<!--
	SLIDE CONTENT. Edit the text here; the script further down only draws it.

	A slide's notes are never shown to the room. `say` is the line to say, `why` is why the slide is
	there, and `asked` is likely questions with their answers. Press p for the speaker view and n for
	the list of every slide's notes.

	kind "race": each step is one row. `lane` picks the column, and `stores` says what a store holds
	from that step on, as [label, value] pairs. `outcome` is where the race ends up; `fix`, when
	present, is revealed after it.
-->
<script>
const SLIDES = [
	{
		kind: "title",
		title: "Polling Is a Backstop, Not a Clock",
		subtitle: "Building high precision durable timers",
		speaker: "Oluwafemi Shobande",
		link: "github.com/aikirun/aiki",
		linkUrl: "https://github.com/aikirun/aiki",
	},
	{
		kind: "lines",
		title: "Oluwafemi Shobande",
		photo: "speakerPhoto",
		lines: [
			"Creator of Aiki, an open source durable execution framework.",
			"Before that, a senior engineer at Bolt, where I helped build the on-demand food and grocery delivery business from its early days.",
			"Earlier, real-time audio and video at Microsoft Teams, and distributed ledgers at Interswitch.",
		],
		say: "I build systems whose job is to fire things on time.",
		why: "Says who is speaking and why they have a view on timers. Keep it under a minute.",
	},
	{
		kind: "entries",
		title: "You request a ride",
		entries: [
			["A driver has this long to accept", "15 s"],
			["Another ride is booked for", "6:00 tomorrow"],
		],
		conclusion: "Both have to survive a restart, so both are rows in a database.",
		say: "A wait of a few milliseconds can stay in the process. These two can't.",
		why: "Sets up the two timers the rest of the talk leans on: a short one somebody is waiting on, and a long one that has to outlive a restart.",
		asked: [
			["Why not keep the 15-second one in memory?", "A deploy or a crash inside those 15 seconds would lose it, and with several replicas no single process owns it."],
		],
	},

	// Why two places

	{
		kind: "code",
		title: "First try: poll the database",
		code: `// which offers have expired?
setInterval(async () => {
  const expiredOffers = await findExpiredOffers();
  if (expiredOffers.length > 0) {
    await offerToNextDrivers(expiredOffers);
  }
}, 1000);`,
		ticks: { everyMs: 1000, dueAtMs: 1200, dueLabel: "offer expires" },
		say: "Each driver's window runs up to a second long, most polls find nothing, and every replica reads the same rows.",
		why: "The loop everyone has written. Every later slide improves on it.",
		asked: [
			["Why not just poll faster?", "That is the next slide: lateness and query load move together."],
		],
	},
	{
		kind: "table",
		title: "One number sets both",
		columns: ["Poll every", "Late by up to", "Polls per second, on every replica"],
		rows: [
			["1 s", "1 s", "1"],
			["500 ms", "500 ms", "2"],
			["100 ms", "100 ms", "10"],
		],
		say: "Poll faster and the database pays; poll slower and the rider waits.",
		why: "Names the problem. The poll interval is one knob for two things: how late a timer fires and how hard the database is hit.",
	},
	{
		kind: "code",
		title: "Second try: back off when idle",
		code: `let waitMs = 125;
while (true) {
  const expiredOffers = await findExpiredOffers();
  if (expiredOffers.length > 0) {
    await offerToNextDrivers(expiredOffers);
    waitMs = 125;
  } else {
    waitMs = Math.min(waitMs * 2, 1000);
  }
  await sleep(waitMs);
}`,
		outcomes: [
			{ tone: "late", text: "Cheaper when idle, but the first offer after a quiet spell still waits up to a second." },
		],
		say: "Cheap when idle, late when idle. And it guesses at what every row already states: when it is due.",
		why: "The obvious improvement, and why it falls short: it gives up precision exactly when the system is quiet.",

		qr: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" shape-rendering="crispEdges" role="img" aria-label="QR code for aiki.run"><path fill="#ffffff" d="M0 0h33v33H0z"/><path stroke="#000000" d="M4 4.5h7m2 0h1m5 0h2m1 0h7M4 5.5h1m5 0h1m2 0h4m5 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h1m2 0h1m2 0h1m1 0h1m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h4m6 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h1m1 0h6m2 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h2m1 0h1m1 0h3m2 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h2m2 0h2m2 0h1M4 12.5h1m1 0h5m2 0h4m1 0h1m3 0h5M6 13.5h1m1 0h2m3 0h1m6 0h1m2 0h1m3 0h1M4 14.5h3m2 0h2m4 0h2m2 0h2m2 0h1m1 0h1m1 0h2M8 15.5h1m2 0h2m1 0h1m1 0h1m1 0h5m5 0h1M4 16.5h3m1 0h1m1 0h6m3 0h4m1 0h1m1 0h3M4 17.5h6m1 0h2m1 0h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h1M4 18.5h1m1 0h1m1 0h4m1 0h1m3 0h3m3 0h3m1 0h2M4 19.5h1m2 0h2m5 0h1m1 0h2m3 0h1m1 0h2m3 0h1M4 20.5h1m2 0h1m1 0h3m4 0h1m1 0h7m1 0h1M12 21.5h3m5 0h1m3 0h2M4 22.5h7m3 0h3m3 0h1m1 0h1m1 0h1m1 0h3M4 23.5h1m5 0h1m1 0h1m1 0h2m2 0h1m1 0h1m3 0h2m2 0h1M4 24.5h1m1 0h3m1 0h1m1 0h1m2 0h1m3 0h6m1 0h1m1 0h1M4 25.5h1m1 0h3m1 0h1m1 0h1m3 0h7m1 0h5M4 26.5h1m1 0h3m1 0h1m1 0h3m2 0h2m1 0h1m4 0h2m1 0h1M4 27.5h1m5 0h1m2 0h2m1 0h2m1 0h2m2 0h3m2 0h1M4 28.5h7m1 0h1m3 0h1m1 0h2m1 0h8"/></svg>`,
	},

	// Backup

	{
		kind: "table",
		title: "Where this lives in Aiki",
		columns: ["Piece", "File"],
		rows: [
			["The consumer loop", "sdk/server/src/daemon/due-timers-consumer.ts"],
			["The queue's four operations", "types/src/infra/timer.ts"],
			["The queue across replicas, on Redis", "sdk/adapter/redis/src/timer/priority-queue.ts"],
			["The queue in one process, a heap", "sdk/adapter/memory/src/timer/priority-queue.ts"],
			["Adding a timer when it is created", "sdk/server/src/infra/timer/imminent-timer-queue.ts"],
			["The scans", "sdk/server/src/daemon/imminent-*.ts"],
			["Scan interval, lookahead, overshoot", "sdk/server/src/config/runtime.ts"],
		],
		dense: true,
		pathColumn: 1,
		source: { repo: "https://github.com/aikirun/aiki", ref: "v0.43.2" },
		note: "Paths as of v0.43.2 in github.com/aikirun/aiki",
		say: "Backup slide, for anyone who asks where the code is.",
		why: "For anyone who wants to read the code. Each path is a link to the file.",
	},
];

// The parts of the talk, by the title of the slide each starts on, with the minutes to aim for.
const PARTS = [
	{ startsAt: "Polling Is a Backstop, Not a Clock", name: "Opening", minutes: 3 },
	{ startsAt: "First try: poll the database", name: "Why two places", minutes: 6 },
	{ startsAt: "The consumer sleeps until the earliest timer", name: "One consumer", minutes: 12 },
	{ startsAt: "A second replica, with its own memory", name: "More replicas", minutes: 4 },
	{ startsAt: "How late a timer fires", name: "Results and close", minutes: 2 },
	{ startsAt: "Where this lives in Aiki", name: "Backup", minutes: 0 },
];
</script>

<script>
const STAGE_WIDTH = 1280;
const STAGE_HEIGHT = 720;
const TIMELINE_WIDTH = STAGE_WIDTH - 128;
const stage = document.getElementById("stage");
const notesList = document.getElementById("notes");

let slideIndex = 0;
// A slide is shown in states: state 0 is the slide as it first appears, and each press reveals the next.
let stateIndex = 0;

const stateCounters = {
	title: () => 1,
	lines: () => 1,
	close: () => 1,
	statement: () => 1,
	table: () => 1,
	// Every entry, then the conclusion.
	entries: (slide) => 1 + (slide.conclusion ? 1 : 0),
	// The code, then the picture, then every outcome on one press.
	code: (slide) => 1 + (slide.ticks ? 1 : 0) + (slide.outcomes && !slide.outcomesFromStart ? 1 : 0),
	compare: (slide) => (slide.columnsTogether ? 1 : slide.columns.length) + (slide.conclusion ? 1 : 0),
	// The database, then the scan and memory with the conclusion.
	split: () => 2,
	histograms: (slide) => slide.panels.length,
	// The run up to the wipe, then the whole run with the conclusion.
	wiped: () => 2,
	// The bare line, then one state for each scan that runs before the timer is due.
	lookahead: (slide) => 1 + Math.ceil(slide.timeline.dueAtS / slide.timeline.scanEveryS),
	burst: () => 3,
	// The empty scene, one state per step, the outcome, then the fix.
	race: (slide) => slide.steps.length + 2 + (slide.fix ? 1 : 0),
};

function stateCount(slide) {
	return stateCounters[slide.kind](slide);
}

function escapeHtml(text) {
	return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Class names for something revealed at `revealedAt`: hidden before it, animated on the press that reveals it.
function revealClasses(state, revealedAt, isEntering) {
	if (state < revealedAt) {
		return " is-hidden";
	}
	return state === revealedAt && isEntering ? " is-entering" : "";
}

function heading(slide) {
	return `<h2>${escapeHtml(slide.title)}</h2>`;
}

function renderOutcome(outcome, classes) {
	return `<div class="outcome outcome-${outcome.tone}${classes}">${escapeHtml(outcome.text)}</div>`;
}

function highlight(code) {
	const token =
		/(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(async|await|const|let|for|of|while|return|if|else|interface|true|null)\b|\b(\d+)\b/gm;
	let html = "";
	let cursor = 0;
	for (const match of code.matchAll(token)) {
		const kind = match[1] ? "comment" : match[2] ? "string" : match[3] ? "keyword" : "number";
		html += escapeHtml(code.slice(cursor, match.index));
		html += `<span class="tok-${kind}">${escapeHtml(match[0])}</span>`;
		cursor = match.index + match[0].length;
	}
	return html + escapeHtml(code.slice(cursor));
}

// Text that opens `url` in a new tab, or plain text when the slide gives no URL.
function renderLink(text, url) {
	if (!url) {
		return escapeHtml(text);
	}
	return `<a href="${url}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`;
}

function renderTitle(slide) {
	return `
		<section class="title-slide">
			<h1>${escapeHtml(slide.title)}</h1>
			<div class="subtitle">${escapeHtml(slide.subtitle)}</div>
			<div class="speaker">${escapeHtml(slide.speaker)}</div>
			<div class="link">${renderLink(slide.link, slide.linkUrl)}</div>
		</section>`;
}

// Marks drawn before a handle to say which site it belongs to, on a 24 by 24 grid.
const ICONS = {
	x: "M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z",
};

function renderClose(slide) {
	const icon = slide.linkIcon
		? `<svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[slide.linkIcon]}"/></svg>`
		: "";
	return `
		<section class="close-slide">
			<div class="qr">${slide.qr}</div>
			<div>
				<h1>${escapeHtml(slide.title)}</h1>
				<div class="address">${renderLink(slide.address, slide.addressUrl)}</div>
				<div class="speaker">${escapeHtml(slide.speaker)}</div>
				<div class="link">${icon}${renderLink(slide.link, slide.linkUrl)}</div>
			</div>
		</section>`;
}

function renderLines(slide) {
	const lines = slide.lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("");
	if (!slide.photo) {
		return `${heading(slide)}<section class="lines">${lines}</section>`;
	}
	return `
		${heading(slide)}
		<section class="bio">
			<img src="${ASSETS[slide.photo]}" alt="${escapeHtml(slide.title)}">
			<div class="lines">${lines}</div>
		</section>`;
}

function renderStatement(slide) {
	const detail = slide.detail ? `<div class="statement-detail">${escapeHtml(slide.detail)}</div>` : "";
	return `
		<section class="statement">
			<div class="statement-text">${escapeHtml(slide.text)}</div>
			${detail}
		</section>`;
}

function renderEntries(slide, state, isEntering) {
	const entries = slide.entries
		.map(
			([text, value]) => `
				<div class="big-entry">
					<span>${escapeHtml(text)}</span><span class="value">${escapeHtml(value)}</span>
				</div>`
		)
		.join("");
	const conclusion = slide.conclusion
		? renderOutcome({ tone: "plain", text: slide.conclusion }, revealClasses(state, 1, isEntering))
		: "";
	return `${heading(slide)}<section class="big-entries">${entries}</section>${conclusion}`;
}

// Polls on a line, the moment the timer is due, and the stretch it waits for the next poll.
function renderTicks(ticks, classes) {
	const left = 40;
	const right = TIMELINE_WIDTH - 40;
	const axisY = 78;
	const spanMs = ticks.everyMs * 3;
	const x = (ms) => left + (ms / spanMs) * (right - left);
	const foundAtMs = Math.ceil(ticks.dueAtMs / ticks.everyMs) * ticks.everyMs;
	const lateMs = foundAtMs - ticks.dueAtMs;

	let polls = "";
	for (let ms = 0; ms <= spanMs; ms += ticks.everyMs) {
		polls += `<line class="mark" x1="${x(ms)}" y1="${axisY - 14}" x2="${x(ms)}" y2="${axisY + 14}"/>`;
		polls += `<text class="mark-label" x="${x(ms)}" y="${axisY + 42}">poll</text>`;
	}

	return `
		<svg class="timeline${classes}" viewBox="0 0 ${TIMELINE_WIDTH} 132" width="${TIMELINE_WIDTH}" height="132"
			role="img" aria-label="The timer is due ${lateMs} ms before the next poll finds it">
			<line class="axis" x1="${left}" y1="${axisY}" x2="${right}" y2="${axisY}"/>
			${polls}
			<line class="late-span" x1="${x(ticks.dueAtMs)}" y1="${axisY}" x2="${x(foundAtMs)}" y2="${axisY}"/>
			<circle class="due" cx="${x(ticks.dueAtMs)}" cy="${axisY}" r="8"/>
			<text class="due-label" text-anchor="end" x="${x(ticks.dueAtMs) - 14}" y="${axisY - 26}">${escapeHtml(ticks.dueLabel)}</text>
			<text class="late-label" x="${(x(ticks.dueAtMs) + x(foundAtMs)) / 2}" y="${axisY - 26}">${lateMs} ms late</text>
		</svg>`;
}

function renderCode(slide, state, isEntering) {
	let html = `${heading(slide)}<pre>${highlight(slide.code)}</pre>`;
	if (slide.ticks) {
		html += renderTicks(slide.ticks, revealClasses(state, 1, isEntering));
	}
	// Every outcome arrives on one press, after the picture when there is one.
	const outcomeClasses = slide.outcomesFromStart ? "" : revealClasses(state, slide.ticks ? 2 : 1, isEntering);
	for (const outcome of slide.outcomes ?? []) {
		html += renderOutcome(outcome, outcomeClasses);
	}
	return html;
}

// A file path, linked to that file in the repository when the slide names one. A path with a
// wildcard links to its folder.
function renderPath(path, source) {
	if (!source) {
		return escapeHtml(path);
	}
	const url = path.includes("*")
		? `${source.repo}/tree/${source.ref}/${path.slice(0, path.lastIndexOf("/"))}`
		: `${source.repo}/blob/${source.ref}/${path}`;
	return `<a href="${url}" target="_blank" rel="noopener">${escapeHtml(path)}</a>`;
}

function renderTable(slide) {
	const head = slide.columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("");
	const rows = slide.rows
		.map((row) => {
			const cells = row
				.map((cell, column) =>
					column === slide.pathColumn
						? `<td class="is-path">${renderPath(cell, slide.source)}</td>`
						: `<td>${escapeHtml(cell)}</td>`
				)
				.join("");
			return `<tr>${cells}</tr>`;
		})
		.join("");
	const note = slide.note ? `<div class="table-note">${escapeHtml(slide.note)}</div>` : "";
	return `
		${heading(slide)}
		<table${slide.dense ? ' class="is-dense"' : ""}><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
		${note}`;
}

function renderCompare(slide, state, isEntering) {
	const columns = slide.columns
		.map((column, index) => {
			const lines = column.lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("");
			return `
				<div class="compare-column${slide.columnsTogether ? "" : revealClasses(state, index, isEntering)}">
					<div class="compare-name">${escapeHtml(column.name)}</div>
					${lines}
				</div>`;
		})
		.join("");
	const conclusion = slide.conclusion
		? renderOutcome(
				{ tone: "plain", text: slide.conclusion },
				revealClasses(state, slide.columnsTogether ? 1 : slide.columns.length, isEntering)
			)
		: "";
	return `${heading(slide)}<section class="compare">${columns}</section>${conclusion}`;
}

function renderEntryList(entries, isNew = () => false) {
	if (entries.length === 0) {
		return `<div class="store-empty">empty</div>`;
	}
	return entries
		.map(
			([label, value]) =>
				`<div class="entry${value === "fired" ? " is-fired" : ""}${isNew(label, value) ? " is-new" : ""}"><span>${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`
		)
		.join("");
}

function renderSplit(slide, state, isEntering) {
	return `
		${heading(slide)}
		<section class="split">
			<div class="store store-database">
				<div class="store-name">${escapeHtml(slide.database.name)}</div>
				${renderEntryList(slide.database.entries)}
			</div>
			<div class="split-scan${revealClasses(state, 1, isEntering)}">
				${escapeHtml(slide.scan[0])}
				<svg width="170" height="24" viewBox="0 0 170 24" aria-hidden="true">
					<line x1="2" y1="12" x2="154" y2="12"/><path d="M152 3l16 9-16 9z"/>
				</svg>
				${escapeHtml(slide.scan[1])}
			</div>
			<div class="store store-timers${revealClasses(state, 1, isEntering)}">
				<div class="store-name">${escapeHtml(slide.memory.name)}</div>
				${renderEntryList(slide.memory.entries)}
			</div>
		</section>
		${renderOutcome({ tone: "plain", text: slide.conclusion }, revealClasses(state, 1, isEntering))}`;
}

// Scans on a line and a timer due later. Each press shows how far one scan looks ahead, and whether it reaches the timer.
function renderLookahead(slide, state, isEntering) {
	const { scanEveryS, lookaheadS, dueAtS, spanS } = slide.timeline;
	const left = 70;
	const right = TIMELINE_WIDTH - 70;
	const axisY = 130;
	const x = (seconds) => left + (seconds / spanS) * (right - left);
	const reaches = (scanAtS) => dueAtS > scanAtS && dueAtS <= scanAtS + lookaheadS;
	const activeScanAtS = state >= 1 ? (state - 1) * scanEveryS : undefined;

	let scans = "";
	for (let seconds = 0; seconds <= spanS; seconds += scanEveryS) {
		const isChance = activeScanAtS !== undefined && seconds <= activeScanAtS && reaches(seconds);
		const chance = isChance ? " is-chance" : "";
		scans += `<line class="mark${chance}" x1="${x(seconds)}" y1="${axisY - 16}" x2="${x(seconds)}" y2="${axisY + 16}"/>`;
		scans += `<text class="mark-label${chance}" x="${x(seconds)}" y="${axisY + 78}">scan at ${seconds}s</text>`;
	}

	let lookahead = "";
	if (activeScanAtS !== undefined) {
		const classes = (reaches(activeScanAtS) ? "" : " is-miss") + (isEntering ? " is-entering" : "");
		const endS = Math.min(activeScanAtS + lookaheadS, spanS);
		const label = reaches(activeScanAtS)
			? `the scan at ${activeScanAtS}s lifts it into memory`
			: `the scan at ${activeScanAtS}s looks ${lookaheadS}s ahead, and the timer is out of reach`;
		lookahead = `
			<rect class="window${classes}" x="${x(activeScanAtS)}" y="${axisY - 46}"
				width="${x(endS) - x(activeScanAtS)}" height="92" rx="10"/>
			<text class="window-label${classes}" x="${(x(activeScanAtS) + x(endS)) / 2}" y="${axisY - 62}">${label}</text>`;
	}

	return `
		${heading(slide)}
		<svg class="timeline" viewBox="0 0 ${TIMELINE_WIDTH} 230" width="${TIMELINE_WIDTH}" height="230" role="img"
			aria-label="Scans every ${scanEveryS}s, each looking ${lookaheadS}s ahead, and a timer due at ${dueAtS}s">
			${lookahead}
			<line class="axis" x1="${left}" y1="${axisY}" x2="${right}" y2="${axisY}"/>
			${scans}
			<circle class="due" cx="${x(dueAtS)}" cy="${axisY}" r="9"/>
			<text class="due-label" text-anchor="middle" x="${x(dueAtS)}" y="${axisY + 42}">due at ${dueAtS}s</text>
		</svg>
		${renderOutcome({ tone: "plain", text: slide.conclusion }, revealClasses(state, stateCount(slide) - 1, isEntering))}`;
}

// A burst of timers on a millisecond line: first one wake-up each, then one late wake-up that takes them all.
function renderBurst(slide, state, isEntering) {
	const { timersAtMs, overshootMs, spanMs } = slide.timeline;
	const left = 40;
	const right = TIMELINE_WIDTH - 40;
	const axisY = 120;
	const x = (ms) => left + (ms / spanMs) * (right - left);
	const firstAtMs = timersAtMs[0];
	const lastAtMs = timersAtMs[timersAtMs.length - 1];
	const wakeAtMs = firstAtMs + overshootMs;
	const eachClasses = state === 1 ? (isEntering ? " is-entering" : "") : " is-hidden";
	const onceClasses = revealClasses(state, 2, isEntering);

	let marks = "";
	for (let ms = 0; ms <= spanMs; ms += 10) {
		marks += `<line class="mark" x1="${x(ms)}" y1="${axisY - 10}" x2="${x(ms)}" y2="${axisY + 10}"/>`;
		marks += `<text class="mark-label" x="${x(ms)}" y="${axisY + 44}">${ms} ms</text>`;
	}
	const timers = timersAtMs.map((ms) => `<circle class="due" cx="${x(ms)}" cy="${axisY}" r="7"/>`).join("");
	const wakeEach = timersAtMs
		.map((ms) => `<line class="wake wake-each" x1="${x(ms)}" y1="${axisY - 54}" x2="${x(ms)}" y2="${axisY - 26}"/>`)
		.join("");

	return `
		${heading(slide)}
		<svg class="timeline" viewBox="0 0 ${TIMELINE_WIDTH} 200" width="${TIMELINE_WIDTH}" height="200" role="img"
			aria-label="${timersAtMs.length} timers due between ${firstAtMs} and ${lastAtMs} ms, and one wake-up at ${wakeAtMs} ms">
			<rect class="overshoot${onceClasses}" x="${x(firstAtMs)}" y="${axisY - 20}"
				width="${x(wakeAtMs) - x(firstAtMs)}" height="40" rx="8"/>
			<line class="axis" x1="${left}" y1="${axisY}" x2="${right}" y2="${axisY}"/>
			${marks}
			${timers}
			<g class="${eachClasses.trim()}">
				${wakeEach}
				<text class="wake-each-label" x="${(x(firstAtMs) + x(lastAtMs)) / 2}" y="${axisY - 72}">
					${timersAtMs.length} wake-ups
				</text>
			</g>
			<g class="${onceClasses.trim()}">
				<line class="wake wake-once" x1="${x(wakeAtMs)}" y1="${axisY - 54}" x2="${x(wakeAtMs)}" y2="${axisY - 26}"/>
				<text class="wake-once-label" x="${x(wakeAtMs) + 4}" y="${axisY - 72}">
					one wake-up, ${overshootMs} ms after the first timer is due
				</text>
			</g>
		</svg>
		${renderOutcome({ tone: "on-time", text: slide.conclusion }, onceClasses)}`;
}

// A bar standing on the baseline, with only its top corners rounded.
function barPath(x, width, height, baseline) {
	const radius = Math.min(3, height / 2, width / 2);
	return `M${x} ${baseline}v${radius - height}q0 ${-radius} ${radius} ${-radius}h${width - 2 * radius}q${radius} 0 ${radius} ${radius}v${height - radius}z`;
}

// How late the sleeps fired, one histogram per run on the same millisecond axis. Each run's bars are
// scaled to its own tallest bar: the point is where the lateness sits, not how many fired.
function renderHistograms(slide, state, isEntering) {
	const { binMs, spanMs } = MEASURED.lateness;
	const left = 40;
	const right = TIMELINE_WIDTH - 40;
	const plotHeight = 118;
	const x = (ms) => left + (ms / spanMs) * (right - left);
	const barWidth = x(binMs) - x(0) - 2;

	let marks = "";
	for (let ms = 0; ms <= spanMs; ms += 100) {
		marks += `<text class="mark-label" x="${x(ms)}" y="${plotHeight + 30}">${ms} ms</text>`;
	}

	const panels = slide.panels
		.map((panel, index) => {
			const run = MEASURED.lateness[panel.data];
			const tallest = Math.max(...run.bins);
			const bars = run.bins
				.map((count, bin) => {
					if (count === 0) {
						return "";
					}
					// A floor of 3px keeps the few stragglers visible.
					const height = Math.max(3, (count / tallest) * plotHeight);
					return `<path class="bar" d="${barPath(x(bin * binMs) + 1, barWidth, height, plotHeight)}"/>`;
				})
				.join("");
			return `
				<div class="histogram${revealClasses(state, index, isEntering)}">
					<div class="histogram-name">
						${escapeHtml(panel.name)}
						<span>p50 ${run.medianMs} ms, p99 ${run.p99Ms} ms</span>
					</div>
					<svg class="timeline" viewBox="0 0 ${TIMELINE_WIDTH} ${plotHeight + 38}" width="${TIMELINE_WIDTH}"
						height="${plotHeight + 38}" role="img"
						aria-label="${escapeHtml(panel.name)}: median ${run.medianMs} ms late, worst ${run.worstMs} ms">
						${bars}
						<line class="axis" x1="${left}" y1="${plotHeight}" x2="${right}" y2="${plotHeight}"/>
						${marks}
					</svg>
				</div>`;
		})
		.join("");

	return `${heading(slide)}${panels}<div class="table-note">${escapeHtml(slide.note)}</div>`;
}

// Every sleep of the run whose queue was emptied part-way: when it was due against how late it fired.
function renderWiped(slide, state, isEntering) {
	const { wipedAtS, scanAtS, worstMs, medianMs, points } = MEASURED.wiped;
	const left = 76;
	const right = TIMELINE_WIDTH - 40;
	const top = 44;
	const bottom = 300;
	const spanS = 50;
	const spanLateS = 10;
	const x = (seconds) => left + (seconds / spanS) * (right - left);
	const y = (lateS) => bottom - (lateS / spanLateS) * (bottom - top);
	const afterWipe = revealClasses(state, 1, isEntering);

	let grid = "";
	for (let lateS = 0; lateS <= spanLateS; lateS += 2) {
		grid += `<line class="${lateS === 0 ? "axis" : "grid"}" x1="${left}" y1="${y(lateS)}" x2="${right}" y2="${y(lateS)}"/>`;
		grid += `<text class="mark-label" text-anchor="end" x="${left - 12}" y="${y(lateS) + 7}">${lateS} s</text>`;
	}
	for (let seconds = 0; seconds <= spanS; seconds += 10) {
		grid += `<text class="mark-label" x="${x(seconds)}" y="${bottom + 30}">${seconds} s</text>`;
	}

	let dots = "";
	for (let index = 0; index < points.length; index += 2) {
		const dueAtS = points[index];
		if (state === 0 && dueAtS >= wipedAtS) {
			continue;
		}
		dots += `<circle class="dot" cx="${x(dueAtS)}" cy="${y(points[index + 1] / 1_000)}" r="3.5"/>`;
	}

	return `
		${heading(slide)}
		<svg class="timeline chart" viewBox="0 0 ${TIMELINE_WIDTH} 360" width="${TIMELINE_WIDTH}" height="360" role="img"
			aria-label="Sleeps fire about ${medianMs} ms late until the queue is emptied at ${wipedAtS}s. Those due before the next scan at ${scanAtS}s fire up to ${(worstMs / 1_000).toFixed(1)}s late, and then lateness returns to ${medianMs} ms.">
			${grid}
			<text class="chart-note" text-anchor="end" x="${left - 12}" y="${top - 20}">late by</text>
			<text class="chart-note" text-anchor="end" x="${right}" y="${bottom + 56}">seconds into the run</text>
			<g class="${afterWipe.trim()}">
				<line class="wipe-mark" x1="${x(wipedAtS)}" y1="${top - 12}" x2="${x(wipedAtS)}" y2="${bottom}"/>
				<text class="chart-label" text-anchor="end" x="${x(wipedAtS) - 10}" y="${top + 4}">queue emptied</text>
				<line class="scan-mark" x1="${x(scanAtS)}" y1="${top - 12}" x2="${x(scanAtS)}" y2="${bottom}"/>
				<text class="chart-label" text-anchor="start" x="${x(scanAtS) + 10}" y="${top + 4}">next scan</text>
			</g>
			${dots}
		</svg>
		${renderOutcome({ tone: "on-time", text: slide.conclusion }, revealClasses(state, 1, isEntering))}`;
}

function storeEntries(slide, storeId, revealedSteps) {
	let entries = slide.initial[storeId] ?? [];
	for (const step of slide.steps.slice(0, revealedSteps)) {
		if (step.stores && storeId in step.stores) {
			entries = step.stores[storeId];
		}
	}
	return entries;
}

function renderStore(slide, store, revealedSteps, isEntering) {
	const entries = storeEntries(slide, store.id, revealedSteps);
	const previousEntries = revealedSteps > 0 ? storeEntries(slide, store.id, revealedSteps - 1) : entries;
	const wasThere = new Set(previousEntries.map(([label, value]) => `${label} ${value}`));
	const isNew = (label, value) => isEntering && !wasThere.has(`${label} ${value}`);
	return `
		<div class="store store-${store.id}">
			<div class="store-name">${escapeHtml(store.name)}</div>
			${renderEntryList(entries, isNew)}
		</div>`;
}

function renderRace(slide, state, isEntering) {
	const stepCount = slide.steps.length;
	const revealedSteps = Math.min(state, stepCount);
	const isStepLatest = state >= 1 && state <= stepCount;
	const rowCount = stepCount + 2 + (slide.fix ? 1 : 0);

	const lanes = slide.lanes
		.map(
			(name, lane) => `
				<div class="lane-name" style="grid-column:${lane + 1}">${escapeHtml(name)}</div>
				<div class="rail" style="grid-column:${lane + 1};grid-row:2 / span ${stepCount}"></div>`
		)
		.join("");

	const steps = slide.steps
		.map((step, index) => {
			const current = isStepLatest && index === revealedSteps - 1 ? " is-current" : "";
			const aside = step.aside ? `<span class="aside">${escapeHtml(step.aside)}</span>` : "";
			return `
				<div class="step${current}${revealClasses(state, index + 1, isEntering)}"
					style="grid-column:${step.lane + 1};grid-row:${index + 2}">${escapeHtml(step.text)}${aside}</div>`;
		})
		.join("");

	const outcome = `
		<div class="outcome outcome-${slide.outcome.tone}${revealClasses(state, stepCount + 1, isEntering)}"
			style="grid-row:${stepCount + 2}">${escapeHtml(slide.outcome.text)}</div>`;
	const fix = slide.fix
		? `<div class="outcome outcome-on-time${revealClasses(state, stepCount + 2, isEntering)}"
				style="grid-row:${stepCount + 3}">${escapeHtml(slide.fix)}</div>`
		: "";

	const stores = slide.stores
		.map((store) => renderStore(slide, store, revealedSteps, isEntering && isStepLatest))
		.join("");

	return `
		${heading(slide)}
		<section class="race">
			${lanes}
			${steps}
			${outcome}
			${fix}
			<div class="stores" style="grid-row:1 / span ${rowCount}">${stores}</div>
		</section>`;
}

const renderers = {
	title: renderTitle,
	close: renderClose,
	lines: renderLines,
	statement: renderStatement,
	entries: renderEntries,
	code: renderCode,
	table: renderTable,
	compare: renderCompare,
	split: renderSplit,
	lookahead: renderLookahead,
	burst: renderBurst,
	histograms: renderHistograms,
	wiped: renderWiped,
	race: renderRace,
};

function slideTitle(slide) {
	return slide.title ?? slide.text ?? "";
}

// Everything inside a stage for one state of one slide. The speaker view draws its previews with it too.
function renderSlide(slideAt, stateAt, isEntering) {
	const slide = SLIDES[slideAt];
	const states = stateCount(slide);

	let reveals = "";
	if (states > 1) {
		for (let state = 0; state < states; state++) {
			reveals += `<i class="${state <= stateAt ? "is-shown" : ""}"></i>`;
		}
	}

	return `
		${renderers[slide.kind](slide, stateAt, isEntering)}
		<div class="reveals">${reveals}</div>
		<div class="page">${slideAt + 1} / ${SLIDES.length}</div>`;
}

// isEntering is true only when the presenter stepped forward, so going back never replays an animation.
function render(isEntering) {
	stage.innerHTML = renderSlide(slideIndex, stateIndex, isEntering);
	history.replaceState(null, "", `#${slideIndex + 1}.${stateIndex}`);
	renderSpeakerView();
}

function next() {
	if (stateIndex < stateCount(SLIDES[slideIndex]) - 1) {
		stateIndex++;
	} else if (slideIndex < SLIDES.length - 1) {
		slideIndex++;
		stateIndex = 0;
	} else {
		return;
	}
	render(true);
}

function previous() {
	if (stateIndex > 0) {
		stateIndex--;
	} else if (slideIndex > 0) {
		slideIndex--;
		stateIndex = stateCount(SLIDES[slideIndex]) - 1;
	} else {
		return;
	}
	render(false);
}

function goTo(slide, state) {
	slideIndex = Math.min(Math.max(slide, 0), SLIDES.length - 1);
	stateIndex = Math.min(Math.max(state, 0), stateCount(SLIDES[slideIndex]) - 1);
	render(false);
}

// A slide's notes: the line to say, why the slide is there, and answers to likely questions.
function renderNotes(slide) {
	let html = "";
	if (slide.say) {
		html += `<p class="note-say">${escapeHtml(slide.say)}</p>`;
	}
	if (slide.why) {
		html += `<p class="note-more"><span>Why this slide</span>${escapeHtml(slide.why)}</p>`;
	}
	for (const [question, answer] of slide.asked ?? []) {
		html += `<p class="note-more"><span>If asked: ${escapeHtml(question)}</span>${escapeHtml(answer)}</p>`;
	}
	return html;
}

// The notes list: every slide's notes on one page, for rehearsing and printing. Each title links to its slide.
function renderNotesList() {
	const totalMinutes = PARTS.reduce((sum, part) => sum + part.minutes, 0);
	let html = `
		<h1>${escapeHtml(slideTitle(SLIDES[0]))}</h1>
		<p class="notes-summary">
			Speaker notes. ${SLIDES.length} slides, about ${totalMinutes} minutes.
			Press n for the slides and p for the speaker view.
		</p>`;

	SLIDES.forEach((slide, index) => {
		// Two slides can share a title, so a part starts at the first slide with its title only.
		const part = PARTS.find(
			(candidate) => SLIDES.findIndex((other) => slideTitle(other) === candidate.startsAt) === index
		);
		if (part) {
			const aim = part.minutes > 0 ? `aim for about ${part.minutes} minutes` : "only if asked";
			html += `<h2>${escapeHtml(part.name)}<span>${aim}</span></h2>`;
		}
		const reveals = stateCount(slide) - 1;
		const revealCount =
			reveals === 0 ? "" : `<span class="notes-reveals">${reveals} ${reveals === 1 ? "reveal" : "reveals"}</span>`;
		html += `
			<section>
				<div class="notes-number">${index + 1}</div>
				<div>
					<h3><a href="#${index + 1}.0">${escapeHtml(slideTitle(slide))}</a>${revealCount}</h3>
					${renderNotes(slide)}
				</div>
			</section>`;
	});

	notesList.innerHTML = html;
}

function isNotesListShown() {
	return document.documentElement.classList.contains("is-notes");
}

function showNotesList() {
	document.documentElement.classList.add("is-notes");
	renderNotesList();
	history.replaceState(null, "", "#notes");
	window.scrollTo(0, 0);
}

function showSlides() {
	document.documentElement.classList.remove("is-notes");
	render(false);
}

// `#3.2` opens slide 3 with two reveals already made, so a reload lands where it left off.
// `#notes` opens the notes list.
function goToHash() {
	if (location.hash === "#notes") {
		showNotesList();
		return;
	}
	document.documentElement.classList.remove("is-notes");
	const [slide, state] = location.hash.slice(1).split(".").map(Number);
	goTo(Number.isFinite(slide) ? slide - 1 : 0, Number.isFinite(state) ? state : 0);
}

function fitStage() {
	const scale = Math.min(window.innerWidth / STAGE_WIDTH, window.innerHeight / STAGE_HEIGHT);
	stage.style.transform = `scale(${scale})`;
}

// The speaker view is a second window that this one writes into: the notes, what the room sees, and
// what the next press shows. It runs no script of its own, so it cannot fall out of step with the slides.
let speakerWindow;
let speakerTimerStartedAt = 0;

function isSpeakerViewOpen() {
	return speakerWindow !== undefined && !speakerWindow.closed;
}

function positionAfterNextPress() {
	if (stateIndex < stateCount(SLIDES[slideIndex]) - 1) {
		return { slideAt: slideIndex, stateAt: stateIndex + 1 };
	}
	if (slideIndex < SLIDES.length - 1) {
		return { slideAt: slideIndex + 1, stateAt: 0 };
	}
	return undefined;
}

function renderPreview(size, slideAt, stateAt) {
	return `<div class="preview preview-${size}"><div class="stage">${renderSlide(slideAt, stateAt, false)}</div></div>`;
}

function updateSpeakerClock() {
	if (!isSpeakerViewOpen()) {
		return;
	}
	const elapsed = speakerWindow.document.getElementById("speaker-elapsed");
	if (elapsed) {
		const seconds = Math.floor((Date.now() - speakerTimerStartedAt) / 1_000);
		elapsed.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
	}
}

function renderSpeakerView() {
	if (!isSpeakerViewOpen()) {
		return;
	}
	const slide = SLIDES[slideIndex];
	const nextPosition = positionAfterNextPress();
	let nextCaption = "This is the last slide";
	let nextPreview = "";
	if (nextPosition) {
		nextCaption =
			nextPosition.slideAt === slideIndex
				? `Next press: reveal ${nextPosition.stateAt} of ${stateCount(slide) - 1}`
				: `Next press: slide ${nextPosition.slideAt + 1}`;
		nextPreview = renderPreview("next", nextPosition.slideAt, nextPosition.stateAt);
	}

	const view = speakerWindow.document;
	view.body.innerHTML = `
		<header class="speaker-bar">
			<div class="speaker-position">${slideIndex + 1} / ${SLIDES.length}</div>
			<div class="speaker-title">${escapeHtml(slideTitle(slide))}</div>
			<div class="speaker-clock">
				<span id="speaker-elapsed"></span><button type="button" id="speaker-reset">reset</button>
			</div>
		</header>
		<section class="speaker-previews">
			<figure><figcaption>On screen now</figcaption>${renderPreview("now", slideIndex, stateIndex)}</figure>
			<figure><figcaption>${nextCaption}</figcaption>${nextPreview}</figure>
		</section>
		<section>${renderNotes(slide) || '<p class="note-more">No notes for this slide.</p>'}</section>`;
	view.getElementById("speaker-reset").onclick = () => {
		speakerTimerStartedAt = Date.now();
		updateSpeakerClock();
	};
	updateSpeakerClock();
}

// Turns a blank window into the speaker view: the deck's own styles, and the same keys as the slides.
function attachSpeakerView(target) {
	speakerWindow = target;
	const view = target.document;
	view.title = "Speaker view";
	view.documentElement.className = "speaker-view";
	view.head.replaceChildren(...Array.from(document.querySelectorAll("style"), (style) => view.importNode(style, true)));
	view.addEventListener("keydown", onKeyDown);
	speakerTimerStartedAt = Date.now();
	renderSpeakerView();
}

function openSpeakerView() {
	if (isSpeakerViewOpen()) {
		speakerWindow.focus();
		return;
	}
	const opened = window.open("", "speaker-view", "popup,width=1200,height=800");
	if (opened) {
		attachSpeakerView(opened);
	}
}

// Left and right move one reveal at a time; clickers send Page Up and Page Down for the same.
// Up and down skip whole slides: down opens the next slide at its start, up shows the previous one complete.
// p opens the speaker view, n swaps the slides for the notes list, and f toggles full screen.
const forwardKeys = new Set(["ArrowRight", "PageDown", " ", "Enter"]);
const backwardKeys = new Set(["ArrowLeft", "PageUp", "Backspace"]);

// Handles keys pressed in the slides window and in the speaker view, so either can drive the talk.
function onKeyDown(event) {
	if (event.metaKey || event.ctrlKey || event.altKey) {
		return;
	}
	const isFromSlides = event.view === window;

	if (isNotesListShown()) {
		// Every other key is left alone, so the notes list scrolls as a page does.
		if (isFromSlides && (event.key === "n" || event.key === "Escape")) {
			showSlides();
		}
		return;
	}

	if (forwardKeys.has(event.key)) {
		event.preventDefault();
		next();
	} else if (backwardKeys.has(event.key)) {
		event.preventDefault();
		previous();
	} else if (event.key === "ArrowDown") {
		event.preventDefault();
		goTo(slideIndex + 1, 0);
	} else if (event.key === "ArrowUp") {
		event.preventDefault();
		goTo(slideIndex - 1, Number.MAX_SAFE_INTEGER);
	} else if (event.key === "Home") {
		goTo(0, 0);
	} else if (event.key === "End") {
		goTo(SLIDES.length - 1, Number.MAX_SAFE_INTEGER);
	} else if (event.key === "p") {
		openSpeakerView();
	} else if (event.key === "n" && isFromSlides) {
		showNotesList();
	} else if (event.key === "f" && isFromSlides) {
		if (document.fullscreenElement) {
			document.exitFullscreen();
		} else {
			document.documentElement.requestFullscreen();
		}
	}
}

document.addEventListener("keydown", onKeyDown);

// A click or tap on the left third goes back; anywhere else goes forward. A click on a link follows the link.
document.addEventListener("click", (event) => {
	if (isNotesListShown() || event.target.closest("a")) {
		return;
	}
	if (event.clientX < window.innerWidth / 3) {
		previous();
	} else {
		next();
	}
});

window.addEventListener("resize", fitStage);
window.addEventListener("hashchange", goToHash);
// A speaker view left open after this window goes would show a frozen slide, so it goes too.
window.addEventListener("pagehide", () => {
	if (isSpeakerViewOpen()) {
		speakerWindow.close();
	}
});

// Start once the whole file is parsed: the image data sits in a script at the very end.
document.addEventListener("DOMContentLoaded", () => {
	fitStage();
	goToHash();
	setInterval(updateSpeakerClock, 1_000);
});
</script>
