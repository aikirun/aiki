# Standalone Aiki stack — pulls the published images at a pinned version.
# Put a .env next to this file with DATABASE_PROVIDER=sqlite (or DATABASE_PROVIDER=pg and
# DATABASE_URL), then: docker compose up -d
services:
  migrate:
    image: ghcr.io/aikirun/cli:0.43.2
    container_name: aiki-migrate
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:?Set DATABASE_PROVIDER - sqlite, or pg with DATABASE_URL}
      DATABASE_PATH: ${DATABASE_PATH:-/data/aiki.db}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
    volumes:
      - aiki-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["migrate", "apply", "--package", "${AIKI_MIGRATE_PACKAGES:-server${AIKI_SERVER_AUTH_SECRET:+,iam}}"]

  server:
    image: ghcr.io/aikirun/server:0.43.2
    container_name: aiki-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${AIKI_SERVER_PORT:-9850}:${AIKI_SERVER_PORT:-9850}"
    environment:
      AIKI_SERVER_HOST: ${AIKI_SERVER_HOST:-0.0.0.0}
      AIKI_SERVER_PORT: ${AIKI_SERVER_PORT:-9850}
      AIKI_SERVER_BASE_URL: ${AIKI_SERVER_BASE_URL:-http://localhost:9850}
      AIKI_SERVER_AUTH_SECRET: ${AIKI_SERVER_AUTH_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:?Set DATABASE_PROVIDER - sqlite, or pg with DATABASE_URL}
      DATABASE_PATH: ${DATABASE_PATH:-/data/aiki.db}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      REDIS_URL: ${REDIS_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRETTY_LOGS: ${PRETTY_LOGS:-true}
    volumes:
      - aiki-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dashboard:
    image: ghcr.io/aikirun/dashboard:0.43.2
    container_name: aiki-dashboard
    ports:
      - "${AIKI_DASHBOARD_PORT:-9851}:9851"
    environment:
      AIKI_SERVER_UPSTREAM_URL: http://server:${AIKI_SERVER_PORT:-9850}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  aiki-data:
