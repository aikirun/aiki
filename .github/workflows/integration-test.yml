name: Integration Test

# Stands up throwaway backing services and runs integration tests against them.
on:
  workflow_call:

jobs:
  integration-test:
    name: Integration Test (${{ matrix.database-provider }}, ${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database-provider: [pg, sqlite]
        runtime: [bun, node]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_PROVIDER: ${{ matrix.database-provider }}
      DATABASE_URL: postgresql://user:password@localhost:5432/aiki_test
      DATABASE_PATH: aiki_test.db
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      - name: Migrate test database
        run: bun run test:db:migrate:apply

      - name: Run test
        if: matrix.runtime == 'bun'
        run: bun run test:integration

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.runtime == 'node'
        with:
          node-version: 22

      - name: Run test (Node)
        if: matrix.runtime == 'node'
        run: bun run test:integration:node
