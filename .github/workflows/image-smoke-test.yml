name: Image smoke test

# Builds each image and runs the ones with something worth running, catching a
# broken build or a broken entrypoint. Nothing here ships: single-arch, never pushed.
on:
  workflow_call:
    inputs:
      write-cache:
        description: >-
          Export the layer cache. Worth it only where the cache can be read back:
          one written by a pull request run is scoped to that branch, never read
          again, and only evicts entries that would have been.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke-test:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One broken image should not hide the health of the other two.
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: app/server/Dockerfile
          - image: dashboard
            dockerfile: app/dashboard/Dockerfile
          - image: cli
            dockerfile: cli/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # No QEMU: nothing here builds for a foreign architecture.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: aikirun/${{ matrix.image }}:smoke
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ inputs.write-cache && format('type=gha,scope={0},mode=max', matrix.image) || '' }}

      # There is no server equivalent: its entrypoint takes no arguments and only
      # starts the server, so building the image is the whole check.

      - name: Smoke test dashboard nginx config
        if: matrix.image == 'dashboard'
        run: docker run --rm -e AIKI_SERVER_UPSTREAM_URL=http://127.0.0.1:9850 aikirun/dashboard:smoke nginx -t

      - name: Smoke test cli package resolution
        if: matrix.image == 'cli'
        run: |
          docker run --rm -e DATABASE_PROVIDER=pg aikirun/cli:smoke migrate list --package server
          docker run --rm -e DATABASE_PROVIDER=pg aikirun/cli:smoke migrate list --package iam
