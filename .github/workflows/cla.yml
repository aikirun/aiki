name: CLA

# Blocks a pull request until its author has agreed to the Contributor License
# Agreement in CLA.md. The bot comments on the PR with signing instructions; the
# author agrees by replying with the exact phrase, and the bot records the
# signature and turns the check green.
#
# Signatures are committed to the cla-signatures branch, not main, so the bot
# never pushes to a protected branch. That branch must exist before the first
# run — see .github/CLA-OPERATIONS.md.
#
# pull_request_target rather than pull_request: a PR from a fork runs with a
# read-only token under pull_request, which cannot write the signature file or
# set the check. This job never checks out the PR's code, so the elevated token
# is not exposed to it.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Every run commits to the same signature branch, so they are serialized
# globally rather than per PR: two contributors signing on different PRs at the
# same moment would otherwise race, and the losing push drops a signature.
# Never cancel: a run may be midway through committing a signature, and killing
# it leaves the contributor believing they signed when nothing was recorded.
concurrency:
  group: cla
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run on any PR event. On comments, require both that the thread is a pull
    # request (issue_comment also fires for ordinary issues, and this job holds a
    # write-scoped token) and that the body is one of the two phrases the bot
    # understands — otherwise every conversational reply in the repo starts a job.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/aikirun/aiki/blob/main/.github/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: shobande-femi,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for the contribution. Before this can be merged, please agree to the
            [Contributor License Agreement](https://github.com/aikirun/aiki/blob/main/.github/CLA.md).
            You keep the copyright in your work — the agreement grants Aiki a licence to use
            and relicense it.


            To agree, post a comment on this pull request containing exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
          lock-pullrequest-aftermerge: false
